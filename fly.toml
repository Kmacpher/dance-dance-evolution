# fly.toml — Dance Dance Evolution
# Change `app` and `primary_region` to suit (or let `fly launch` set them).
app = "dance-dance-evolution"
primary_region = "sea"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
